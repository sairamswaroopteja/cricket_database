<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Ensure the page fills the viewport */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensure it takes full height */
        }

        /* Make the wrapper take remaining space */
        main {
            flex: 1; /* Push the footer to the bottom */
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Cricinfo</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="series.html">Series</a></li>
                <li><a href="teams.html">Teams</a></li>
                <li><a href="rankings.html">Rankings</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="hero">
            <h2>MY PROFILE</h2>
        </section>
    
        <section class="profile-container">
            <div class="sidebar">
                <h2>My Account</h2>
                <ul>
                    <li><a href="subscription.html">Subscription</a></li>
                    <li>
                        <button id="sign-out">Sign Out</button>
                    </li>
                    <li>
                        <button id="delete-account" class="delete-btn" style="color: red;">Delete Account</button>
                    </li>
                </ul>
            </div>
    
            <div class="divider"></div>
    
            <div class="details-section">
                <label for="name" style="color:rgb(219, 198, 64);font-size: 20px;">Name</label>
                <input type="text" id="name" readonly>
                
                <label for="email" style="color: rgb(219, 198, 64);font-size: 20px;">Email Id</label>
                <input type="email" id="email" readonly>
            </div>
        </section>
    </main>
    
    <footer>
        <p>© 2024 Cricinfo - All Rights Reserved</p>
    </footer>

    <script>
        const API_BASE = 'http://localhost:3000';

        window.onload = function () {
            const username = localStorage.getItem('username');
            const email = localStorage.getItem('email');

            // Redirect to login if user is not logged in
            if (!username || !email) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('name').value = username;
                document.getElementById('email').value = email;
            }
        };

        // Handle Sign Out functionality
        document.getElementById('sign-out').addEventListener('click', function () {
            localStorage.clear(); // Clear all user data from localStorage
            window.location.href = 'index.html'; // Redirect to the home page
        });

        // Handle Delete Account functionality
        document.getElementById('delete-account').addEventListener('click', async function (e) {
            e.preventDefault();

            const email = localStorage.getItem('email');
            if (!email) {
                alert('No active user session found. Please log in again.');
                window.location.href = 'login.html';
                return;
            }

            const confirmFirst = confirm('Are you sure you want to delete your account? This action cannot be undone.');
            if (!confirmFirst) {
                return;
            }

            try {
                const response = await fetch(API_BASE + '/delete-account', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message || 'Account deleted successfully.');
                    localStorage.clear();
                    window.location.href = 'index.html';
                } else if (response.status === 400 && data.hasActiveSubscriptions) {
                    const confirmForce = confirm(
                        data.message + '\n\nDo you want to cancel your subscriptions and permanently delete your account?'
                    );
                    if (confirmForce) {
                        const forceResponse = await fetch(API_BASE + '/delete-account', {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ email: email, force: true })
                        });
                        const forceData = await forceResponse.json();
                        if (forceResponse.ok) {
                            alert(forceData.message || 'Account deleted successfully.');
                            localStorage.clear();
                            window.location.href = 'index.html';
                        } else {
                            alert(forceData.message || 'Failed to delete account.');
                        }
                    }
                } else {
                    alert(data.message || 'Failed to delete account.');
                }
            } catch (error) {
                console.error('Error deleting account:', error);
                alert('Cannot connect to server. Please ensure the backend is running on ' + API_BASE);
            }
        });
    </script>
</body>
</html>
